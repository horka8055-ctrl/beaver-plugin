name: Build BeaverPlugin

# Собирается автоматически при каждой загрузке файлов в ветку main,
# а также вручную через кнопку "Run workflow" на вкладке Actions.
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      - name: Установить Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Собрать плагин (mvn clean package)
        run: mvn -B clean package > build.log 2>&1
        continue-on-error: true
        id: build_step

      - name: Сохранить лог сборки и jar в репозиторий (для диагностики/скачивания)
        if: always()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@example.com"
          cp build.log last-build.log
          mkdir -p dist
          if [ -f target/BeaverPlugin.jar ]; then cp target/BeaverPlugin.jar dist/BeaverPlugin.jar; fi
          git add last-build.log dist/BeaverPlugin.jar || true
          git commit -m "build log + jar [skip ci]" || echo "nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep 3
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Провалить джобу, если сборка реально упала
        if: steps.build_step.outcome == 'failure'
        run: exit 1

      - name: Загрузить готовый jar как файл для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: BeaverPlugin-jar
          path: target/BeaverPlugin.jar
